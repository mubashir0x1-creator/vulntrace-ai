{% extends "layout.html" %}

{% block title %}Login · VulnTrace AI{% endblock %}

{% block main %}

<div class="auth-card">

    <div class="auth-label">
        VULNTRACE AI
    </div>

    <h1>Welcome back</h1>

    <p class="text-secondary">
        Access your security analysis workspace.
    </p>


    <form method="post" class="mt-4">

        <div class="mb-3">

            <label
                for="username"
                class="form-label"
            >
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                class="form-control"
                autocomplete="username"
                required
            >

        </div>


        <div class="mb-4">

            <label
                for="password"
                class="form-label"
            >
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Login
        </button>

    </form>


    <p class="mt-4 text-secondary">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create one
        </a>

    </p>

</div>

{% endblock %}
