{% extends "layout.html" %}

{% block title %}Create Account · VulnTrace AI{% endblock %}

{% block main %}

<div class="auth-card">

    <div class="auth-label">
        VULNTRACE AI
    </div>

    <h1>Create your account</h1>

    <p class="text-secondary">
        Build your private security analysis workspace.
    </p>

    <form method="post" class="mt-4">

        <div class="mb-3">

            <label
                for="username"
                class="form-label"
            >
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                class="form-control"
                autocomplete="username"
                required
            >

        </div>


        <div class="mb-3">

            <label
                for="password"
                class="form-label"
            >
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                autocomplete="new-password"
                required
            >

        </div>


        <div class="mb-4">

            <label
                for="confirmation"
                class="form-label"
            >
                Confirm password
            </label>

            <input
                id="confirmation"
                name="confirmation"
                type="password"
                class="form-control"
                autocomplete="new-password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Create account
        </button>

    </form>


    <p class="mt-4 text-secondary">

        Already registered?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
